[project]
name = "zhilume-worker"
version = "0.2.0"
description = "Outbound execution worker for Zhilume"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<0.29", "websockets>=15,<16", "jsonschema>=4.23,<5"]

[project.scripts]
zhilume-worker = "zhilume_worker.__main__:main"
zhilume-preflight = "zhilume_worker.preflight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhilume_worker"]
