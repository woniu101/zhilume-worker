[project]
name = "zhilume-worker"
version = "0.10.0"
description = "Authenticated execution worker for Zhilume"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "websockets>=15,<16",
    "jsonschema>=4.23,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
image = ["Pillow>=11,<13"]
video = ["Pillow>=11,<13"]

[project.scripts]
zhilume-install = "zhilume_worker.installer:main"
zhilume-worker = "zhilume_worker.__main__:main"
zhilume-prepare = "zhilume_worker.deployment:main"
zhilume-preflight = "zhilume_worker.preflight:main"
zhilume-deploy = "zhilume_worker.releases:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhilume_worker"]

[tool.hatch.build.targets.wheel.force-include]
"src/zhilume_worker/web" = "zhilume_worker/web"

[tool.hatch.build.targets.sdist.force-include]
"src/zhilume_worker/web" = "src/zhilume_worker/web"
